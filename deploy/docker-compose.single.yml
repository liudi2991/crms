# 单机部署编排（你的云主机就靠它）
#
# 与 docker-compose.test.yml 的差别：
#   - 不暴露 mysql/redis/minio 端口到外网（仅容器网络内可达）
#   - 镜像默认从本地 docker images 取（无需私有 registry）
#   - 通过 nginx 容器统一对外暴露 80（前端 + /api 反代到 app）
#
# 与 docker-compose.prod.yml 的差别：
#   - 单 app 实例（不双副本）
#   - 不依赖外置 mysql/redis/minio，全部 docker 内置
#
# 启动：cd deploy && docker compose -f docker-compose.single.yml up -d
# 关停：docker compose -f docker-compose.single.yml down
# 查日志：docker compose -f docker-compose.single.yml logs -f crms-app

services:
  mysql:
    image: mysql:8.0
    container_name: crms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?未设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crms}
      MYSQL_USER: ${MYSQL_USERNAME:-crms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?未设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=mysql_native_password
      - --slow_query_log=ON
      - --long_query_time=1
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./logs/mysql:/var/log/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: crms-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1000", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: crms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?未设置 MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    # MinIO 9000 端口暴露到宿主机：浏览器要直接打开预签名 URL 下载附件，
    # 必须能解析到 host。设置防火墙时记得放行 9000/tcp。
    # MinIO 控制台 9001 仅在调试时手动 docker compose port minio 9001 暴露
    ports:
      - "${MINIO_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  crms-app:
    image: crms-app:${IMAGE_TAG:-current}
    container_name: crms-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crms}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-crms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CRMS_STORAGE_TYPE: ${CRMS_STORAGE_TYPE:-minio}
      # 服务端内部 endpoint，put/get 走容器网络
      MINIO_ENDPOINT: http://minio:9000
      # 浏览器可达的对外 endpoint，必须配置为公网/内网 IP 或域名（含 :9000）
      # 否则前端预览/下载会跳转到 http://minio:9000 → DNS 解析失败
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-crms}
      CRMS_AES_KEY: ${CRMS_AES_KEY:?未设置 CRMS_AES_KEY，参考 deploy/SECURITY.md 生成强密钥}
      CRMS_DEFAULT_PASSWORD: ${CRMS_DEFAULT_PASSWORD:-Crms@123456}
    volumes:
      - ./logs/app:/app/logs
      # 本地存储模式（crms.storage.type=local）下附件落在 /app/uploads，
      # 必须挂出来，否则容器升级 recreate 会带走所有上传过的文件。
      # 切到 MinIO（crms.storage.type=minio）时此卷不再被写入，但保留无害。
      - ./data/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  crms-web:
    image: crms-web:${IMAGE_TAG:-current}
    container_name: crms-web
    restart: unless-stopped
    depends_on:
      crms-app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    # 如启用 HTTPS：
    #   ports: ["80:80", "443:443"]
    #   volumes: 挂载 letsencrypt 证书；自行调整 crms-web/nginx.conf
