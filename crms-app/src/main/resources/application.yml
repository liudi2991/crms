spring:
  application:
    name: crms-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    threads:
      max: 200
    connection-timeout: 20000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: ASSIGN_ID
  mapper-locations: classpath*:/mapper/**/*.xml

sa-token:
  token-name: Authorization
  timeout: 43200            # 12 小时硬过期
  active-timeout: 1800      # 30 分钟空闲过期
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  token-prefix: Bearer
  is-read-cookie: false
  is-read-header: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

crms:
  security:
    aes-key: ${CRMS_AES_KEY:0123456789abcdef0123456789abcdef}  # 32 字节，生产由环境变量覆盖
    password-min-length: 8
    login-max-failed: 5
    login-lock-minutes: 15
    default-password: ${CRMS_DEFAULT_PASSWORD:Crms@123456}
  storage:
    # 切换文件存储后端：local（默认，本地磁盘） | minio（MinIO/S3 兼容）
    # 生产多实例部署请设置为 minio，并配置好下方 minio.* 与 MINIO_BUCKET 必要环境变量
    type: ${CRMS_STORAGE_TYPE:local}
    local:
      root: ${CRMS_STORAGE_LOCAL_ROOT:./uploads}
      bucket: ${CRMS_STORAGE_LOCAL_BUCKET:crms-local}
    minio:
      # 服务端内部 endpoint，put/get 走容器网络
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      # 浏览器可达的对外 endpoint，用于生成预签名下载 URL；不配置时回退到 endpoint
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:crms}
  reminder:
    contract-due-days: 30
    payment-due-days: 7
    overdue-cycle-days: 3
